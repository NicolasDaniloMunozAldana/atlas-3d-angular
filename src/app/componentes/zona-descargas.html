<h2 id="titulo-descargas">Uso sin conexión</h2>
<div class="descargas-barra">
  <button type="button" id="btn-avisos" class="btn-nota secundario" [disabled]="permiso() !== 'default'" (click)="activarAvisos()">🔔 Activar avisos</button>
  <button type="button" id="btn-descargar" class="btn-nota" [disabled]="ocupado()" (click)="descargar()">⬇ Descargar fichas para usar sin conexión</button>
</div>
<p id="estado-avisos" class="estado-linea">{{ textoAvisos() }}</p>
<progress id="progreso-descarga" [max]="progreso()?.total ?? 8" [value]="progreso()?.hechos ?? 0" [hidden]="progreso() === null"></progress>
<p id="estado-descarga" class="estado-linea" role="status">{{ mensaje() }}</p>
